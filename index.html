<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفي المميز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110b;--card:#1f1a10;--ink:#f6efdc;--mut:#b5a782;--gold:#d4a83a;--gold2:#f3d77a;--line:#3a3220;--ok:#2ecc71;--mid:#f39c12;--bad:#e74c3c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf6ea;--card:#fff;--ink:#1d1708;--mut:#6d5f3a;--gold:#a67c10;--gold2:#7a5a05;--line:#e6dcc0;color-scheme:light}}
:root[data-theme="light"]{--bg:#faf6ea;--card:#fff;--ink:#1d1708;--mut:#6d5f3a;--gold:#a67c10;--gold2:#7a5a05;--line:#e6dcc0;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;padding-bottom:84px}
.wrap{max-width:820px;margin:auto;padding:14px}
h1,h2,h3{margin:.3em 0}.gold{color:var(--gold2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;border:0;border-radius:12px;padding:10px 16px;font:800 15px Cairo,Tahoma;cursor:pointer}
.btn.o{background:none;color:var(--gold2);border:1px solid var(--gold)}.btn.r{background:var(--bad);color:#fff}.btn.s{padding:6px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--gold2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:0}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#6b4e0a);display:grid;place-items:center;font-weight:800;color:#1a1405;font-size:20px;flex:none}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px;font:15px Cairo,Tahoma}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--gold);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font:600 12px Cairo,Tahoma;display:grid;gap:2px;justify-items:center;cursor:pointer;padding:4px 8px}
nav button.on{color:var(--gold2)}nav span{font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.tabs button{white-space:nowrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#111}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin:auto;font-weight:800;font-size:26px}
.splash{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#3a2c08,var(--bg) 70%);color:#f6efdc}
.splash h1{font-size:48px;color:#f3d77a;text-shadow:0 0 24px #d4a83a88}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 9px;font:600 13px Cairo,Tahoma;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1405}.seg button:disabled{opacity:.35}
.card{position:relative}.tg{position:absolute;top:6px;left:8px;background:none;border:0;color:var(--gold2);font-size:16px;cursor:pointer;z-index:2}.card.shut>*:not(:first-child):not(.tg){display:none}
.stat{width:104px;height:104px;border-radius:50%!important;padding:6px!important;display:grid;place-items:center;align-content:center;font-size:12px;margin:4px auto!important}.stat b{font-size:22px}
.bubs,#list{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:6px 0}.bub{width:92px;text-align:center;cursor:pointer;font-size:12px}.bub .c{width:78px;height:78px;border-radius:50%;margin:auto;display:grid;place-items:center;background:var(--card);border:2px solid var(--gold);font-weight:800;font-size:26px;color:var(--gold2);transition:box-shadow .3s}
nav[hidden]{display:none}.clipon .cw{touch-action:none;cursor:crosshair}
@media(prefers-reduced-motion:no-preference){.splash h1{animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{text-shadow:0 0 44px #f3d77acc}}}
</style></head><body><div id="app"></div>
<nav id="nav" hidden></nav>
<script>
const K='safi-almumayyaz-v1';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{students:[],days:{},notes:{},log:{},knights:{},pw:'',teacher:'ناصر بادي عوض',school:'مدرسة الانفال الابتدائية للبنين',cls:'الثالث الابتدائي'};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('تعذر الحفظ')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
let S={date:iso(new Date()),v:'splash',sid:null,tab:'info',per:'day'};
const off=d=>[4,5].includes(new Date(d+'T12:00').getDay());
const day=d=>db.days[d]||(db.days[d]={hol:'',att:{},ev:{}});
const FIELDS=[['att','الحضور',5],['beh','السلوك',5],['prep','التحضير اليومي',10],['part','المشاركة',10],['nb','الدفتر',10],['bk','الكتاب',10]];
const lab=x=>x>=9?['ممتاز جدًا','⭐⭐⭐⭐⭐','var(--ok)']:x>=8?['جيد جدًا','⭐⭐⭐⭐','var(--ok)']:x>=7?['جيد','⭐⭐⭐','var(--mid)']:x>=5?['متوسط','⭐⭐','var(--mid)']:['يحتاج إلى متابعة','⭐','var(--bad)'];
function score(id,d){const e=db.days[d]?.ev?.[id];if(!e||off(d)||['a','e'].includes(db.days[d].att[id]?.s))return null;let t=0,n=0;FIELDS.forEach(([k,,m])=>{if(e[k]){t+=e[k]/m;n++}});return n?t/n*10:null}
function range(p){const t=new Date(S.date+'T12:00'),a=new Date(t);if(p=='week')a.setDate(t.getDate()-((t.getDay()+1)%7));else if(p=='month')a.setDate(1);return[iso(a),S.date]}
function avg(id,p='all'){let [a,b]=p=='all'?['0000','9999']:range(p),t=0,n=0;for(const d in db.days){if(d>=a&&d<=b){const s=score(id,d);if(s!=null){t+=s;n++}}}return n?t/n:null}
const fmt=x=>x==null?'—':(Math.round(x*10)/10);
const stu=id=>db.students.find(s=>s.id==id);
function absCount(id,st){let n=0;for(const d in db.days)if(db.days[d].att[id]?.s==st)n++;return n}
function need(s){const r=[],a=avg(s.id);if(a!=null&&a<6)r.push('تقييم منخفض');if(absCount(s.id,'a')>=3)r.push('غيابات كثيرة');if(absCount(s.id,'l')>=3)r.push('تأخر متكرر');return r}
function trend(id){const ds=Object.keys(db.days).sort().filter(d=>score(id,d)!=null).map(d=>score(id,d));if(ds.length<4)return'';const h=ds.length>>1,f=x=>x.reduce((a,b)=>a+b,0)/x.length,d=f(ds.slice(h))-f(ds.slice(0,h));return d>.7?'📈 هناك تحسن ملحوظ في مستوى الطالب.':d<-.7?'⚠️ مستوى الطالب يحتاج إلى متابعة.':f(ds)>=9?'🏆 الطالب يحافظ على مستوى متميز.':''}
const WIS=['العلم نور، والجهل ظلام.','من جدّ وجد، ومن زرع حصد.','الصدق منجاة، والكذب مهواة.','أحسن إلى الناس تستعبد قلوبهم.','النظافة من الإيمان.','اطلبوا العلم من المهد إلى اللحد.','خير الناس أنفعهم للناس.','القراءة غذاء العقل.','الوقت كالسيف إن لم تقطعه قطعك.','ما ضاع حق وراءه مطالب.'];
const MOT=['كل طفل يحمل بداخله موهبة تنتظر من يكتشفها، وكل يوم دراسي فرصة جديدة ليصبح أفضل مما كان عليه بالأمس.','أنت قادر على أن تكون أفضل.','استمر، نجاحك يبدأ بخطوة.'];
const TIPS=[[/وطني|استقلال|عيد/,'مناسبة وطنية نعتز بها: نتذكر فيها حب الوطن والحفاظ عليه. اقترح على تلاميذك رسم العلم أو كتابة جملة عن حب الوطن.'],[/استشهاد|امام|إمام|وفاة|ذكرى/,'يوم نستذكر فيه سيرة عظيمة. حدّث تلاميذك عن قيم الصدق والشجاعة والصبر التي تعلمناها منه، وادعُ لهم بالتأسي بها.'],[/حرب|ظروف|أمني/,'حرصنا على سلامتكم أولًا. ابقوا في المنازل مع أهلكم، ولا تخرجوا إلا للضرورة، واتبعوا تعليمات الأهل.'],[/جو|مطر|امطار|أمطار|عاصف|غبار|حر|طقس/,'بسبب سوء الأحوال الجوية: ابقَ في البيت، ابتعد عن الماء والكهرباء، والبس ملابس مناسبة، وراجع دروسك في هذا الوقت.']];
const tip=r=>(TIPS.find(t=>t[0].test(r))||[0,'يوم تعطيل رسمي: استغلّه في القراءة ومراجعة دروسك ومساعدة أهلك.'])[1];
const share=(t)=>{if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t))};
const wa0=0;
function go(v,x){S.v=v;if(x)Object.assign(S,x);render();scrollTo(0,0)}
function setNav(){const n=$('#nav');n.hidden=['splash','mot','lock'].includes(S.v);n.innerHTML=[['home','🏆','الرئيسية'],['att','📋','الحضور'],['eval','⭐','التقييم'],['knights','🥇','الفرسان'],['more','☰','المزيد']].map(a=>`<button class="${S.v==a[0]?'on':''}" onclick="go('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('')}
function dateBar(){const o=off(S.date),h=db.days[S.date]?.hol;return `<div class="card row"><button class="btn s o" onclick="shift(-1)">▶</button><input type="date" class="grow" value="${S.date}" onchange="S.date=this.value;render()"><button class="btn s o" onclick="shift(1)">◀</button>${o?'<span class="pill" style="background:var(--mut)">عطلة رسمية (خميس/جمعة)</span>':h?`<span class="pill" style="background:var(--mid)">عطلة: ${esc(h)}</span>`:`<button class="btn s o" onclick="holiday()">🚫 عطلة رسمية</button>`}</div>`}
function shift(n){const d=new Date(S.date+'T12:00');d.setDate(d.getDate()+n);S.date=iso(d);render()}
function holiday(){const r=prompt('سبب التعطيل (مثال: اليوم الوطني، استشهاد إمام، حرب، سوء أحوال جوية):');if(!r)return;day(S.date).hol=r.trim();save();render();if(confirm('معلومة للتلاميذ عن المناسبة:\n\n'+tip(r)+'\n\nمشاركتها الآن؟'))share('📢 عطلة رسمية: '+r+'\n\n'+tip(r)+'\n— '+db.teacher)}
function closed(){return off(S.date)||db.days[S.date]?.hol}
function render(){setNav();const a=$('#app');({splash,mot,lock,home,att,eval:evalV,knights,more,student,form,stats,wisdom,settings}[S.v]||home)(a)}
function splash(a){a.innerHTML=`<div class="splash"><div><div style="font-size:90px">🏆</div><h1>صفي المميز</h1><p style="font-size:20px">إعداد الأستاذ ${esc(db.teacher)}<br>معلم الصف ${esc(db.cls)}<br>${esc(db.school)}</p><p style="color:#d9c88f">«نحو تعليمٍ أفضل... وتلاميذ أكثر تألقًا.»</p><button class="btn" style="font-size:20px;padding:14px 60px;margin-top:30px" onclick="go('mot')">متابعة</button></div></div>`}
function mot(a){a.innerHTML=`<div class="splash"><div class="wrap"><h2 class="gold" style="font-size:28px">وقل ربي زدني علماً 📚</h2><div class="card" style="font-size:22px;line-height:2;border-color:var(--gold);box-shadow:0 0 30px #d4a83a44;color:var(--ink)">${MOT[0]}</div><button class="btn" style="font-size:18px;padding:14px 30px" onclick="enter()">اضغط للدخول إلى بيئة التطبيق</button></div></div>`}
function enter(){go(db.pw?'lock':'home')}
function lock(a){a.innerHTML=`<div class="splash"><div class="card"><h2>🔒 التطبيق مقفل</h2><input id="pw" type="password" placeholder="كلمة المرور"><br><br><button class="btn" onclick="if($('#pw').value==db.pw)go('home');else alert('كلمة المرور غير صحيحة')">دخول</button></div></div>`}
function stuRow(s){const sc=avg(s.id),l=sc!=null?lab(sc):null,st=db.days[S.date]?.att[s.id]?.s;return `<div class="card row" onclick="go('student',{sid:${s.id},tab:'info'})" style="cursor:pointer"><div class="av">${esc(s.name[0])}</div><div class="grow"><b>${esc(s.name)}</b><div style="font-size:12px;color:var(--mut)">📞 ${esc(s.phone||'—')} · ${{p:'🟢 حاضر',a:'🔴 غائب',l:'🟡 متأخر',e:'🔵 مجاز'}[st]||'لم يُسجّل'}</div></div><div style="text-align:center">${l?`<span class="pill" style="background:${l[2]}">${fmt(sc)}/10</span><div style="font-size:11px">${l[0]}</div>`:'—'}</div></div>`}
function ranked(){return db.students.map(s=>({s,a:avg(s.id)})).filter(x=>x.a!=null).sort((x,y)=>y.a-x.a)}
function home(a){const R=ranked(),t=db.days[S.date]?.att||{},pres=Object.values(t).filter(x=>x.s=='p'||x.s=='l').length,ab=Object.values(t).filter(x=>x.s=='a'||x.s=='e').length,all=R.length?R.reduce((p,c)=>p+c.a,0)/R.length:null;const nd=db.students.filter(s=>need(s).length).length,ex=R.filter(x=>x.a>=9).length;const k=(p)=>(db.knights[p+':'+(p=='day'?S.date:range(p)[0])]||[]).map(i=>stu(i)?.name).filter(Boolean)[0]||'—';
a.innerHTML=`<div class="wrap"><h2>🏆 صفي المميز <small style="font-size:13px;color:var(--mut)">أ. ${esc(db.teacher)}</small></h2>${dateBar()}
<div class="grid"><div class="card stat">👨‍🎓<b>${db.students.length}</b>الطلاب</div><div class="card stat">🟢<b>${pres}</b>حاضرون</div><div class="card stat">🔴<b>${ab}</b>غائبون</div><div class="card stat">📊<b>${fmt(all)}</b>متوسط الصف</div><div class="card stat">⭐<b>${ex}</b>متميزون</div><div class="card stat">🎯<b>${nd}</b>يحتاجون متابعة</div></div>
<div class="card">🥇 أفضل طالب: <b class="gold">${R[0]?esc(R[0].s.name):'—'}</b> · فارس اليوم: <b>${esc(k('day'))}</b> · فارس الأسبوع: <b>${esc(k('week'))}</b> · فارس الشهر: <b>${esc(k('month'))}</b></div>
${db.students.filter(s=>need(s).length).map(s=>`<div class="card" style="border-color:var(--bad)">🔔 ${esc(s.name)}: ${need(s).join('، ')}</div>`).join('')}
<div class="row"><h3 class="grow">قائمة الطلاب</h3><input id="q" placeholder="🔍 بحث بالاسم أو الرقم أو ولي الأمر" style="max-width:260px" oninput="flt()"><button class="btn" onclick="go('form',{sid:null})">➕ إضافة طالب</button></div><div id="list">${db.students.map(stuRow).join('')||'<div class="card">لا يوجد طلاب بعد. اضغط «إضافة طالب» للبدء.</div>'}</div></div>`}
function flt(){const q=$('#q').value.trim();$('#list').innerHTML=db.students.filter(s=>[s.name,s.num,s.guardian].join(' ').includes(q)).map(stuRow).join('')}
function att(a){const t=day(S.date).att;a.innerHTML=`<div class="wrap"><h2>📋 الحضور والغياب</h2>${dateBar()}${closed()?'<div class="card">لا يمكن تسجيل الحضور في يوم عطلة.</div>':`<button class="btn" onclick="allP()">🟢 تحضير الجميع حاضرين</button>`+db.students.map(s=>{const c=t[s.id]?.s;return `<div class="card"><b>${esc(s.name)}</b> <span style="font-size:12px;color:var(--mut)">غياب: ${absCount(s.id,'a')+absCount(s.id,'e')} · تأخر: ${absCount(s.id,'l')}</span>${t[s.id]?.r?`<div style="font-size:12px">السبب: ${esc(t[s.id].r)}</div>`:''}<div class="seg row" style="margin-top:6px">${[['p','🟢 حاضر'],['a','🔴 غائب'],['l','🟡 متأخر'],['e','🔵 مبرر']].map(x=>`<button class="${c==x[0]?'on':''}" onclick="mark(${s.id},'${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}).join('')}</div>`}
function mark(id,s){let r='';if(s=='a'||s=='e'){r=prompt('اذكر سبب الغياب/الإجازة:');if(r==null)return;if(!r.trim())return alert('السبب مطلوب')}day(S.date).att[id]={s,r:r.trim()};save();att($('#app'))}
function allP(){db.students.forEach(s=>day(S.date).att[s.id]={s:'p',r:''});save();render()}
function evalV(a){const d=day(S.date);a.innerHTML=`<div class="wrap"><h2>⭐ التقييم اليومي</h2>${dateBar()}${closed()?'<div class="card">لا تُجرى التقييمات في أيام العطلة الرسمية.</div>':db.students.map(s=>{const st=d.att[s.id],lock=st&&(st.s=='a'||st.s=='e'),e=d.ev[s.id]||{},sc=score(s.id,S.date),l=sc!=null?lab(sc):null;return `<div class="card"><div class="row"><b class="grow">${esc(s.name)}</b>${l?`<span class="pill" style="background:${l[2]}">${fmt(sc)}/10 · ${l[0]} ${l[1]}</span>`:''}</div>${lock?`<p>🔒 ${st.s=='a'?'غائب':'مبرر'} — السبب: ${esc(st.r)}. لا يمكن التقييم.</p>`:`<div class="grid">${FIELDS.map(([k,n,m])=>`<div><label>${n} (من ${m})</label><select onchange="setEv(${s.id},'${k}',this.value)"><option value="">—</option>${Array.from({length:m},(_,i)=>`<option ${e[k]==i+1?'selected':''}>${i+1}</option>`).join('')}</select><small>${e[k]?lab(e[k]/m*10)[0]+' '+lab(e[k]/m*10)[1]:''}</small></div>`).join('')}</div>`}</div>`}).join('')}</div>`}
function setEv(id,k,v){const e=day(S.date).ev;(e[id]=e[id]||{})[k]=+v;save();evalV($('#app'))}
function pickKnights(p){const [a]=range(p),key=p+':'+(p=='day'?S.date:a),n=p=='month'?8:7;const sh=x=>x.map(v=>[Math.random(),v]).sort((m,o)=>m[0]-o[0]).map(v=>v[1]);const R=ranked().map(r=>({...r,a:p=='day'?(score(r.s.id,S.date)):avg(r.s.id,p)})).filter(r=>r.a!=null);const t1=sh(R.filter(r=>r.a>=9)),t2=sh(R.filter(r=>r.a>=8&&r.a<9));db.knights[key]=[...t1,...t2].slice(0,n).map(r=>r.s.id);save();render()}
function knights(a){const box=(p,t,n)=>{const ids=db.knights[p+':'+(p=='day'?S.date:range(p)[0])]||[];return `<div class="card"><div class="row"><h3 class="grow">${t}</h3><button class="btn s" onclick="pickKnights('${p}')">🎲 قرعة (${n})</button></div>${ids.map(i=>stu(i)).filter(Boolean).map(s=>`<div class="row" style="margin:6px 0"><div class="av">${esc(s.name[0])}</div><b>${esc(s.name)}</b> <span class="pill" style="background:var(--ok)">${fmt(p=='day'?score(s.id,S.date):avg(s.id,p))}</span><button class="btn s o" onclick="share('🎉 تهانينا للطالب ${esc(s.name)} على اختياره ${t}! — الأستاذ ${esc(db.teacher)}')">تهنئة</button></div>`).join('')||'<small>لم تُجرَ القرعة بعد. تُختار من الحاصلين على ممتاز/ممتاز جدًا (الأولوية لممتاز جدًا).</small>'}</div>`};

const _st2=student;student=function(a){_st2(a);const s=stu(S.sid);if(!s)return;const box=a.querySelector('.wrap').lastElementChild;if(S.tab=='info')box.innerHTML=`<p>👤 <b>${esc(s.name)}</b><br>⚧ الجنس: ${esc(s.gender||'—')}<br>🎓 الصف: ${esc(s.cls||db.cls)}<br>📞 هاتف ولي الأمر: ${esc(s.phone||'—')}<br>💬 واتساب: ${esc(s.wa||'—')}</p><p>${trend(s.id)}</p>`;if(S.tab=='health')box.innerHTML=[['blood','فصيلة الدم'],['allergy','الحساسية'],['chronic','الأمراض المزمنة'],['hnote','ملاحظات صحية']].map(([k,n])=>`<label>${n}</label><input value="${esc((s.h||{})[k])}" onchange="(stu(${s.id}).h=stu(${s.id}).h||{}).${k}=this.value;save()">`).join('')};
function dateBar(){const o=off(S.date),h=db.days[S.date]?.hol;return `<div class="card row"><button class="btn s o" onclick="shift(-1)">▶</button><input type="date" class="grow" value="${S.date}" onchange="S.date=this.value;render()"><button class="btn s o" onclick="shift(1)">◀</button>${o?'<span class="pill" style="background:var(--mut)">عطلة رسمية (خميس/جمعة)</span>':''}${h?`<span class="pill" style="background:var(--mid)">عطلة: ${esc(h)}</span><button class="btn s r" onclick="cancelHol()">↩ إلغاء العطلة</button>`:(!o?'<button class="btn s o" onclick="holiday()">🚫 عطلة رسمية</button>':'')}</div>`}
function cancelHol(){yes('إلغاء العطلة وإعادة هذا اليوم دراسيًا؟',()=>{day(S.date).hol='';save();render()})}
let CL=null;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('safi-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function fput(rec){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fall(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('f').objectStore('f').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function fdel(id){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function lessons(a){a.innerHTML=`<div class="wrap"><button class="btn s o" onclick="go('more')">▶ رجوع</button><h2>📚 دروسي</h2><div class="card"><h3>📖 قراءة الصف الثالث</h3><label class="btn" style="display:inline-block">📂 ارفع ملف قراءة الصف الثالث<input type="file" accept=".pdf,image/*,.txt" hidden onchange="upFile(this.files[0])"></label><br><small>يدعم: PDF والصور وملفات النص. يُحفظ الملف داخل التطبيق على جهازك.</small></div><div class="card"><h3>الملفات المحفوظة</h3><div id="fl">جارٍ التحميل...</div></div><div id="viewer"></div></div>`;loadFiles()}
async function loadFiles(){const e=document.getElementById('fl');try{const L=await fall();e.innerHTML=L.map(f=>`<div class="row" style="margin:6px 0"><span class="grow">📄 ${esc(f.name)}</span><button class="btn s" onclick="openF(${f.id})">فتح</button><button class="btn s r" onclick="delF(${f.id})">حذف</button></div>`).join('')||'لا توجد ملفات بعد.'}catch(x){e.textContent='التخزين غير متاح في هذا المتصفح.'}}
async function upFile(f){if(!f)return;try{const id=Date.now();await fput({id,name:f.name,type:f.type||'',blob:f});await loadFiles();openF(id)}catch(e){alert('تعذر حفظ الملف.')}}
function delF(id){yes('حذف الملف؟',async()=>{await fdel(id);document.getElementById('viewer').innerHTML='';loadFiles()})}
function loadPdfJs(){return window.pdfjsLib?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res()};s.onerror=rej;document.head.appendChild(s)})}
function clippable(cv){const w=document.createElement('div');w.className='cw';w.style.position='relative';cv.style.cssText='width:100%;display:block;border:1px solid var(--line);border-radius:8px';const s=document.createElement('div');s.style.cssText='position:absolute;border:2px dashed #f3d77a;background:#f3d77a33;display:none;pointer-events:none';w.append(cv,s);let st=null;const upd=e=>{if(!st)return;const r=st.r,x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top));s.style.left=Math.min(st.x,x)+'px';s.style.top=Math.min(st.y,y)+'px';s.style.width=Math.abs(x-st.x)+'px';s.style.height=Math.abs(y-st.y)+'px';const k=cv.width/r.width;CL={cv,x0:st.x*k,y0:st.y*k,x1:x*k,y1:y*k}};w.onpointerdown=e=>{if(!document.getElementById('viewer').classList.contains('clipon'))return;const r=cv.getBoundingClientRect();st={x:e.clientX-r.left,y:e.clientY-r.top,r};w.setPointerCapture(e.pointerId);s.style.display='block';upd(e)};w.onpointermove=upd;w.onpointerup=()=>{st=null};return w}
function clipShare(){const c=CL;if(!c||Math.abs(c.x1-c.x0)<8||Math.abs(c.y1-c.y0)<8)return alert('فعّل القص ثم اسحب بإصبعك على الجزء المطلوب.');const sx=Math.min(c.x0,c.x1),sy=Math.min(c.y0,c.y1),sw=Math.abs(c.x1-c.x0),sh=Math.abs(c.y1-c.y0),o=document.createElement('canvas');o.width=sw;o.height=sh;o.getContext('2d').drawImage(c.cv,sx,sy,sw,sh,0,0,sw,sh);o.toBlob(b=>saveImg(b))}
function txtShare(){const e=document.getElementById('ftxt'),t=e.value.slice(e.selectionStart,e.selectionEnd);if(!t.trim())return alert('حدّد جزءًا من النص أولًا ثم اضغط مشاركة.');shareText(t)}
async function shareFile(){const f=window._f;if(!f)return;const file=new File([f.blob],f.name,{type:f.type});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name=='AbortError')return}try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:f.name,data:f.blob})}catch(e){if(!e||e.code!='declined')alert('تعذرت مشاركة الملف من هنا، استخدم مشاركة المقطع.')}}
async function openF(id){const L=await fall(),f=L.find(x=>x.id==id),v=document.getElementById('viewer');if(!f)return;window._f=f;CL=null;v.className='';v.innerHTML=`<div class="card"><h3>📖 ${esc(f.name)}</h3><div class="row"><button class="btn s" onclick="document.getElementById('viewer').classList.toggle('clipon')">✂️ تفعيل/إيقاف القص</button><button class="btn s" onclick="clipShare()">📤 مشاركة المقطع</button><button class="btn s o" onclick="shareFile()">📎 مشاركة الملف</button></div><small>فعّل القص، اسحب بإصبعك على الجزء المطلوب، ثم اضغط مشاركة المقطع. أوقف القص للتمرير.</small><div id="pages">جارٍ الفتح...</div></div>`;const P=document.getElementById('pages'),n=(f.name||'').toLowerCase();try{if((f.type||'').startsWith('image/')||/\.(png|jpe?g|gif|webp)$/.test(n)){const bm=await createImageBitmap(f.blob),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);P.innerHTML='';P.appendChild(clippable(c))}else if(f.type=='application/pdf'||n.endsWith('.pdf')){await loadPdfJs();const pdf=await pdfjsLib.getDocument({data:await f.blob.arrayBuffer()}).promise;P.innerHTML='';for(let i=1;i<=Math.min(pdf.numPages,80);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;P.appendChild(clippable(c))}}else{const t=await f.blob.text();P.innerHTML=`<textarea id="ftxt" rows="14" readonly>${esc(t)}</textarea><div style="margin-top:6px"><button class="btn s" onclick="txtShare()">📤 مشاركة المحدد</button></div>`}}catch(e){P.textContent='تعذر فتح الملف داخل التطبيق. يمكنك مشاركته بالزر أعلاه.'}v.scrollIntoView&&v.scrollIntoView()}
